[project]
name = "RAG_against_the_machine"
version = "0.1.0"
description = "Will you answer my questions?"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.14.0",
    "bm25s>=0.3.10",
    "fire>=0.7.1",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.2.6",
    "ollama>=0.6.2",
    "pydantic>=2.13.4",
    "pystemmer>=3.1.0",
    "torch>=2.13.0",
    "transformers>=5.15.0",
]

[dependency-groups]
dev = ["flake8>=7.0.0", "mypy>=1.10.0", "pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.flake8]
exclude = [".venv", "__pycache__", ".mypy_cache", ".pytest_cache"]
